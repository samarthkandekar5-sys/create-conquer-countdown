<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CREATE · CONQUER — Live Countdown</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}
main{width:min(100%,1000px);text-align:center}
.motto{font-size:clamp(15px,2.5vw,23px);letter-spacing:.48em;font-weight:500;text-transform:uppercase;margin-bottom:clamp(38px,9vh,90px);color:#f8f8f8}
.label{color:#666;font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin-bottom:20px}
.days{font-size:clamp(44px,10.5vw,112px);font-weight:300;letter-spacing:-.055em;font-variant-numeric:tabular-nums;line-height:1.03;white-space:nowrap}
.clock{margin-top:22px;display:flex;justify-content:center;gap:clamp(10px,3vw,34px);font-variant-numeric:tabular-nums}
.unit{min-width:clamp(58px,12vw,100px)}
.num{font-size:clamp(21px,4vw,38px);font-weight:300;letter-spacing:.04em}
.unitname{margin-top:7px;color:#626262;font-size:9px;letter-spacing:.22em}
.seconds .num{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.2)}
.millis{margin-top:16px;color:#777;font-size:clamp(12px,2vw,15px);font-variant-numeric:tabular-nums;letter-spacing:.18em}
.millis span{display:inline-block;min-width:3.5em;text-align:left;color:#ddd}
.date{margin-top:32px;color:#555;font-size:10px;letter-spacing:.24em}
.bottom{margin:clamp(40px,8vh,78px) auto 0;max-width:430px}
.track{height:2px;background:#222;overflow:hidden}
.trackfill{height:100%;width:100%;background:#eee;transform-origin:left}
.quote{margin-top:17px;color:#626262;font-size:11px;letter-spacing:.24em}
.edit{margin:30px auto 0;display:flex;gap:7px;justify-content:center;opacity:.12;transition:opacity .2s}
.edit:hover,.edit:focus-within{opacity:1}
input,button{background:#101010;color:#eee;border:1px solid #333;border-radius:4px;padding:8px 9px;font-size:11px;min-width:0}
input{width:38%;text-transform:uppercase}button{cursor:pointer}
@media(max-height:600px){.motto{margin-bottom:22px}.bottom{margin-top:22px}.date{margin-top:16px}}
</style>
</head>
<body>
<main>
  <div class="motto" id="motto">CREATE · CONQUER</div>
  <div class="label">TIME LEFT UNTIL AGE 25</div>
  <div class="days" id="days">— DAYS</div>
  <div class="clock">
    <div class="unit"><div class="num" id="hours">00</div><div class="unitname">HOURS</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="unitname">MINUTES</div></div>
    <div class="unit seconds"><div class="num" id="seconds">00</div><div class="unitname">SECONDS</div></div>
  </div>
  <div class="millis">TIME IS MOVING · <span id="millis">.000</span></div>
  <div class="date">TARGET · 20 NOVEMBER 2033</div>
  <div class="bottom">
    <div class="track"><div class="trackfill" id="trackfill"></div></div>
    <div class="quote">DON'T WAIT. BUILD.</div>
  </div>
  <form class="edit" id="editForm">
    <input id="word1" maxlength="18" aria-label="First mission word" placeholder="WORD 1">
    <input id="word2" maxlength="18" aria-label="Second mission word" placeholder="WORD 2">
    <button type="submit">SET</button>
  </form>
</main>
<script>
/* Every update is calculated from the actual system clock and fixed target,
   rather than subtracting one second per timer tick, so it stays synchronized. */
const target = new Date('2033-11-20T00:00:00+05:30').getTime();
const $ = id => document.getElementById(id);
let previousSecond = null;
function tick(){
  const now = Date.now();
  const remainingMs = Math.max(0, target - now);
  const totalSeconds = Math.floor(remainingMs / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const ms = remainingMs % 1000;
  $('days').textContent = days.toLocaleString('en-US') + ' DAYS';
  $('hours').textContent = String(hours).padStart(2,'0');
  $('minutes').textContent = String(minutes).padStart(2,'0');
  $('seconds').textContent = String(seconds).padStart(2,'0');
  $('millis').textContent = '.' + String(ms).padStart(3,'0');
  // A smooth, rapidly draining 1-second bar makes each passing second feel visible.
  $('trackfill').style.transform = 'scaleX(' + (ms / 1000) + ')';
  if(totalSeconds !== previousSecond){
    $('seconds').animate([{opacity:.45,transform:'translateY(2px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'});
    previousSecond = totalSeconds;
  }
  requestAnimationFrame(tick);
}
function setWords(a,b){
  const one=(a||'CREATE').trim().toUpperCase().slice(0,18)||'CREATE';
  const two=(b||'CONQUER').trim().toUpperCase().slice(0,18)||'CONQUER';
  $('motto').textContent=one+' · '+two;
  try{localStorage.setItem('missionWords',JSON.stringify([one,two]));}catch(e){}
}
try{const saved=JSON.parse(localStorage.getItem('missionWords')||'null');if(saved)setWords(saved[0],saved[1]);}catch(e){}
$('editForm').addEventListener('submit',e=>{e.preventDefault();setWords($('word1').value,$('word2').value);$('word1').value='';$('word2').value='';});
requestAnimationFrame(tick);
</script>
</body>
</html>
